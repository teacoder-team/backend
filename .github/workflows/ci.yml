name: CI

on:
    push:
        branches: [main]
    pull_request:

concurrency:
    group: ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    format:
        name: Format check
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: latest

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Check formatting
              run: bun run format:check

    typecheck:
        name: Typecheck
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: latest

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Generate Prisma client
              run: bun run db:generate

            - name: Typecheck
              run: bun run typecheck

    migrations:
        name: Migration drift check
        runs-on: ubuntu-latest
        services:
            postgres:
                image: postgres:18-alpine
                env:
                    POSTGRES_USER: teacoder
                    POSTGRES_PASSWORD: teacoder
                    POSTGRES_DB: teacoder
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U teacoder -d teacoder"
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5
        env:
            DATABASE_URL: postgresql://teacoder:teacoder@localhost:5432/teacoder?schema=public
        steps:
            - uses: actions/checkout@v4

            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: latest

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Validate schema
              run: bunx prisma validate

            - name: Apply committed migrations
              run: bun run db:deploy

            - name: Check for schema drift
              run: >-
                  bunx prisma migrate diff
                  --from-config-datasource
                  --to-schema ./prisma/models
                  --exit-code
