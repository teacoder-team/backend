name: CD

on:
    push:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: cd-${{ github.ref }}
    cancel-in-progress: false

env:
    REGISTRY: ghcr.io
    IMAGE_NAME: ${{ github.repository }}

jobs:
    ci:
        name: CI
        uses: ./.github/workflows/ci.yml

    image:
        name: Docker image
        needs: ci
        runs-on: ubuntu-latest
        timeout-minutes: 30
        permissions:
            contents: read
            packages: write
        outputs:
            digest: ${{ steps.build.outputs.digest }}
            version: ${{ steps.meta.outputs.version }}
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Login to GHCR
              uses: docker/login-action@v3
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Image metadata
              id: meta
              uses: docker/metadata-action@v5
              with:
                  images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
                  tags: |
                      type=raw,value=latest,enable={{is_default_branch}}
                      type=sha,format=short,prefix=,priority=300
                      type=sha,format=long,prefix=

            - name: Build and push
              id: build
              uses: docker/build-push-action@v6
              with:
                  context: .
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
                  provenance: false

            - name: Image summary
              run: |
                  {
                    echo '### Docker image'
                    echo
                    echo "Digest: \`${{ steps.build.outputs.digest }}\`"
                    echo
                    echo '```'
                    echo "${{ steps.meta.outputs.tags }}"
                    echo '```'
                  } >> "$GITHUB_STEP_SUMMARY"

    deploy:
        name: Deploy
        needs: image
        runs-on: ubuntu-latest
        timeout-minutes: 15
        environment:
            name: production
            url: ${{ vars.PRODUCTION_URL }}
        steps:
            - name: Trigger deployment
              env:
                  DOKPLOY_WEBHOOK_URL: ${{ secrets.DOKPLOY_WEBHOOK_URL }}
              run: |
                  if [ -z "$DOKPLOY_WEBHOOK_URL" ]; then
                    echo '::error::DOKPLOY_WEBHOOK_URL secret is not set'
                    exit 1
                  fi

                  curl --fail-with-body --silent --show-error \
                    --connect-timeout 10 --max-time 30 \
                    --retry 3 --retry-delay 5 --retry-all-errors \
                    --request POST "$DOKPLOY_WEBHOOK_URL"

            - name: Wait for API
              if: vars.PRODUCTION_URL != ''
              env:
                  PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
              run: |
                  for attempt in $(seq 1 30); do
                    if curl --fail --silent --output /dev/null --max-time 5 "$PRODUCTION_URL/health"; then
                      echo "API is healthy after $attempt attempt(s)"
                      exit 0
                    fi

                    sleep 10
                  done

                  echo '::error::API did not become healthy in 5 minutes'
                  exit 1

            - name: Deployment summary
              run: |
                  {
                    echo '### Deployed'
                    echo
                    echo "Image: \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.image.outputs.version }}\`"
                    echo
                    echo "Digest: \`${{ needs.image.outputs.digest }}\`"
                    echo
                    echo "Commit: \`${{ github.sha }}\` by @${{ github.actor }}"
                    if [ -n "${{ vars.PRODUCTION_URL }}" ]; then
                      echo
                      echo "URL: ${{ vars.PRODUCTION_URL }}"
                    fi
                  } >> "$GITHUB_STEP_SUMMARY"
