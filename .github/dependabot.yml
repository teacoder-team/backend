version: 2
updates:
    - package-ecosystem: 'npm'
      directory: '/'
      schedule:
          interval: 'weekly'
          day: 'monday'
      open-pull-requests-limit: 5
      groups:
          dependencies:
              patterns:
                  - '*'
      labels:
          - 'dependencies'
          - 'bun'
      ignore:
          - dependency-name: '@types/*'
            update-types: ['version-update:semver-patch']

    - package-ecosystem: 'docker'
      directory: '/'
      schedule:
          interval: 'monthly'
      labels:
          - 'docker'
          - 'security'

    - package-ecosystem: 'github-actions'
      directory: '/'
      schedule:
          interval: 'monthly'
      labels:
          - 'ci'
