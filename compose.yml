services:
    postgres:
        image: docker.io/library/postgres:18-alpine
        container_name: tcdr-postgres
        restart: always
        environment:
            - POSTGRES_USER=teacoder
            - POSTGRES_PASSWORD=123456
            - POSTGRES_DB=teacoder
        ports:
            - '5432:5432'
        volumes:
            - pg_data:/var/lib/postgresql
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U teacoder -d teacoder']
            interval: 10s
            timeout: 5s
            retries: 5

    redis:
        image: docker.io/library/redis:8-alpine
        container_name: tcdr-redis
        restart: always
        command: ['redis-server', '--appendonly', 'yes']
        ports:
            - '6379:6379'
        volumes:
            - redis_data:/data
        healthcheck:
            test: ['CMD', 'redis-cli', 'ping']
            interval: 10s
            timeout: 5s
            retries: 5

volumes:
    pg_data:
    redis_data:
